<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group Think</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1f1d1a;--mut:#6b665e;--line:#e4dfd6;--acc:#c2410c;--accink:#fff;--good:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#171513;--card:#211e1b;--ink:#f3efe8;--mut:#a39d92;--line:#37332d;--acc:#f97316;--accink:#1a0e05;--good:#4ade80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;margin:0 0 2px}h2{font-size:18px;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:6px 0 10px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 16px;background:var(--acc);color:var(--accink);cursor:pointer}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);font-weight:500}
button:disabled{opacity:.5;cursor:default}
.q{font-size:24px;font-weight:700;line-height:1.25;margin:4px 0 12px}
.timer{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--acc)}
.pill{display:inline-block;font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:2px 10px;margin-right:4px}
.grp{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.grp:first-of-type{border-top:0}
.pts{font-weight:800;color:var(--good);white-space:nowrap}
.who{color:var(--mut);font-size:13px}
.me{background:color-mix(in srgb,var(--acc) 12%,transparent);border-radius:8px}
.lb{display:flex;justify-content:space-between;padding:6px 8px}
.err{color:var(--acc)}
</style></head>
<body><main><h1>Group Think</h1><p class="sub">Think like everyone else. Match answers, score points.</p><div id="app"></div></main>
<script>
const $=document.getElementById("app");
const ls={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let pid=ls.get("gt_pid");if(!pid){pid="p"+Math.random().toString(36).slice(2,12);ls.set("gt_pid",pid)}
let token=ls.get("gt_token"),name=ls.get("gt_name"),S=null,err="",qDraft="",ansDraft="",deadline=0,lastKey="",showLogin=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const g=id=>document.getElementById(id);

function connect(){
  const es=new EventSource("/events?pid="+encodeURIComponent(pid)+"&token="+encodeURIComponent(token));
  es.onmessage=e=>{
    const prev=S;S=JSON.parse(e.data);deadline=Date.now()+S.remaining;
    if(token&&!S.isHost){token="";ls.set("gt_token","")}
    if(name&&!S.joined)post("/join",{pid,name});
    if(!prev||prev.round!==S.round||prev.phase!==S.phase)ansDraft=S.mine||"";
    render();
  };
  es.onerror=()=>{err="Reconnecting…";render()};
  es.onopen=()=>{if(err){err="";render()}};
}
async function post(url,data,auth){
  const h={"Content-Type":"application/json"};if(auth&&token)h["x-token"]=token;
  try{const r=await fetch(url,{method:"POST",headers:h,body:JSON.stringify(data||{})});return await r.json()}catch(e){return{error:"network"}}
}
async function join(){const v=g("nm").value.trim();if(!v)return;name=v;ls.set("gt_name",v);await post("/join",{pid,name})}
async function login(){
  const r=await post("/host/login",{password:g("pw").value});
  if(r.token){token=r.token;ls.set("gt_token",token);showLogin=false;err="";location.reload()}else{err="Wrong password.";lastKey="";render()}
}
async function submit(){const v=g("ans").value.trim();if(!v)return;ansDraft=v;const r=await post("/answer",{pid,answer:v});if(r.error){err="Time’s up or couldn’t save.";lastKey="";render()}}
function clock(){
  if(!S||S.phase!=="playing")return;
  const left=Math.max(0,deadline-Date.now());
  const el=g("clock");if(el)el.textContent=Math.ceil(left/1000)+"s";
  if(left===0){const a=g("ans"),s=g("sub");if(a)a.disabled=true;if(s)s.disabled=true}
}
setInterval(clock,300);
function lb(){return S.leaderboard.length?'<div class="card"><h2>Leaderboard</h2>'+S.leaderboard.map((p,i)=>`<div class="lb ${p.id===pid?"me":""}"><span>${i+1}. ${esc(p.name)}</span><b>${p.score}</b></div>`).join("")+"</div>":""}
function render(){
  const ae=document.activeElement;
  if(ae&&ae.id==="ans")ansDraft=ae.value;
  const key=JSON.stringify([S,!!name,err,showLogin,!!token]);
  if(key===lastKey)return;lastKey=key;
  let h="";
  if(err)h+=`<p class="err">${esc(err)}</p>`;
  if(!S){$.innerHTML=h+"Connecting…";return}
  if(!name){h+=`<div class="card"><h2>Your name</h2><input id="nm" maxlength="24" placeholder="e.g. Priya"><button id="jb">Join</button></div>`}
  else{
    h+=`<p><span class="pill">${S.players.length} player${S.players.length==1?"":"s"}</span><span class="pill">Round ${S.round}</span>${S.isHost?'<span class="pill">Host</span>':""}</p>`;
    if(S.phase==="lobby"){
      h+=S.isHost?`<div class="card"><h2>Type the next question</h2><textarea id="qt" rows="2" placeholder="Type your question…"></textarea><label>Timer</label><select id="dur"><option value="30">30 seconds</option><option value="60" selected>60 seconds</option><option value="90">90 seconds</option><option value="120">2 minutes</option></select><button id="go">Start round</button></div>`:`<div class="card"><h2>Waiting for the host…</h2><p class="sub">The next question is coming up.</p></div>`;
      h+=lb();
    }else if(S.phase==="playing"){
      const over=deadline<=Date.now();
      h+=`<div class="card"><div class="timer" id="clock">${Math.ceil(Math.max(0,deadline-Date.now())/1000)}s</div><div class="q">${esc(S.question)}</div><input id="ans" maxlength="60" placeholder="Your answer" autocomplete="off" ${over?"disabled":""}><button id="sub" ${over?"disabled":""}>${S.mine?"Update answer":"Lock in"}</button>${S.mine?`<p class="who">Saved: ${esc(S.mine)}. You can change it until time’s up.</p>`:""}<p class="who">${S.answeredCount} of ${S.players.length} answered</p>${S.isHost?'<button class="ghost" id="end">End round now</button>':""}</div>`;
    }else{
      h+=`<div class="card"><div class="q">${esc(S.question)}</div><p><b>${S.answered?(S.myPoints?"You scored "+S.myPoints+" point"+(S.myPoints==1?"":"s"):"No points"):"You didn’t answer this one"}</b></p>`;
      h+=S.results.map(r=>`<div class="grp"><div><b>${esc(r.label)}</b><div class="who">${r.names.map(esc).join(", ")}</div></div><div class="pts">${r.pts} pt${r.pts==1?"":"s"} each</div></div>`).join("")||'<p class="who">Nobody answered.</p>';
      h+="</div>"+lb();
      if(S.isHost)h+=`<button id="nx">Next question</button>`;
    }
    if(S.isHost)h+=`<p style="margin-top:28px"><button class="ghost" id="nw">Start a fresh game</button></p>`;
  }
  if(!S.isHost){
    h+=showLogin?`<div class="card" style="margin-top:28px"><h2>Host login</h2><input id="pw" type="password" placeholder="Host password"><button id="li">Log in</button></div>`:`<p style="margin-top:28px"><button class="ghost" id="hl">Host login</button></p>`;
  }
  $.innerHTML=h;
  if(g("jb"))g("jb").onclick=join;if(g("nm"))g("nm").onkeydown=e=>{if(e.key==="Enter")join()};
  if(g("qt")){g("qt").value=qDraft;g("qt").oninput=e=>{qDraft=e.target.value}}
  if(g("go"))g("go").onclick=async()=>{const q=g("qt").value.trim();if(!q)return;await post("/host/start",{question:q,duration:+g("dur").value},true);qDraft=""};
  if(g("ans")){g("ans").value=ansDraft;g("ans").onkeydown=e=>{if(e.key==="Enter")submit()}}
  if(g("sub"))g("sub").onclick=submit;
  if(g("end"))g("end").onclick=()=>post("/host/end",{},true);
  if(g("nx"))g("nx").onclick=()=>post("/host/next",{},true);
  if(g("nw"))g("nw").onclick=()=>{if(confirm("Reset scores and start a fresh game?"))post("/host/new",{},true)};
  if(g("hl"))g("hl").onclick=()=>{showLogin=true;lastKey="";render()};
  if(g("li"))g("li").onclick=login;if(g("pw"))g("pw").onkeydown=e=>{if(e.key==="Enter")login()};
}
connect();
</script></body></html>
